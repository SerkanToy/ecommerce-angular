<div class="flex flex-row space-x-10 space-y-5 pt-3">
    <input *ngFor="let box of codeBoxes; let i = index" 
     #codeInput class="shadow-xl/30 " style="width: 40px; height: 50px; font-size: 1.2rem; padding: 0;" type="text" maxlength="1"
     [(ngModel)]="code[i]" (input)="onCodeInput($event,i)" (keydown)="onCodeKeydown($event,i)"/>
    <i class="fas fa-times" (click)="clearCode()"></i>
</div>
