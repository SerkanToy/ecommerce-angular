<form [formGroup]="form" (ngSubmit)="save()" autocomplete="off"
    class="bg-white text-gray-500 w-full max-w-[340px] mx-4 md:p-6 p-4 py-8 text-left text-sm rounded-lg shadow-[0px_0px_10px_0px] shadow-black/10">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Change Password</h2>

    <app-form-input [formControl]="$any(form.controls['currentPassword'])" [type]="'password'"
        [label]="'Current Password'" [submitted]="submitted"></app-form-input>

    <app-form-input [formControl]="$any(form.controls['newPassword'])" [type]="'password'" [label]="'New Password'"
        [submitted]="submitted" [minLength]="6" [maxLength]="15"></app-form-input>

    <app-form-input [formControl]="$any(form.controls['confirmNewPassword'])" [type]="'password'"
        [label]="'Confirm new Password'" [submitted]="submitted"
        [invalidMessage]="'Confirm new Password does not match the New Password'"></app-form-input>




    <p class="text-center mt-4">Already have an account? <a href="/account/login" class="text-blue-500 underline">Log
            In</a></p>

    @if(errorMessages.length > 0)
    {
    <div>
        <div>
            <app-validationmessage [erromessage]="errorMessages"></app-validationmessage>
        </div>
    </div>
    }
    <div>
        <div>
            <div>
                <div>
                    <button type="submit"
                        class="w-full mb-3 bg-indigo-500 hover:bg-indigo-600 transition-all active:scale-95 py-2.5 rounded text-white font-medium">
                        Change Password
                    </button>
                </div>
            </div>
        </div>
    </div>

</form>
