@if (email) {
<div class="flex flex-col justify-center items-center mt-3">
    <div class="">
        <h1>Email Confirmation</h1>
    </div>
    <div class="flex flex-col">
        <div class="text-center">
            <p class="">
                Enter the code we sent to
                <span class="">{{email}}</span>
            </p>

            <app-code-input (fullCode)="fullCodeReceive($event)"></app-code-input>

            <div class="">
                <a routerLink="/account/send-email/resend-confirmation-email" class="btn btn-link">
                    Didn't get a code?
                </a>
            </div>
        </div>

        <div class="">
            <div class="">
                <div class="">
                    <div class="d-grid mt-4 px-1">
                        <button class="bg-transparent hover:bg-blue-500 text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-transparent rounded" [disabled]="!fullCode || fullCode.length < 6"
                            (click)="submit()">
                            Confirm email
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
}
